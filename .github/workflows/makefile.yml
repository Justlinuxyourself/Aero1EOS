
name: AliOS Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            gcc-multilib \
            binutils \
            xorriso \
            mtools \
            grub-common \
            grub-pc-bin

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            This is an automated build of AliOS for the notebook hardware.
            
            **Last Updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # 1. Get Diff
          RAW_DIFF=$(git diff ${{ github.event.before }} ${{ github.sha }} -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' | head -n 20)
          [ -z "$RAW_DIFF" ] && RAW_DIFF="No source changes."

          # 2. Use Python to build the JSON object safely
          # This handles all the nasty escaping for you
          python3 -c '
          import json, os, sys

          diff_text = os.environ.get("RAW_DIFF", "")
          msg_text = os.environ.get("COMMIT_MSG", "")
          actor = os.environ.get("GITHUB_ACTOR", "")
          commit_url = os.environ.get("COMMIT_URL", "")

          payload = {
              "content": "<@&1503391410785882225>",
              "embeds": [{
                  "author": {
                      "name": actor,
                      "icon_url": f"https://github.com/{actor}.png"
                  },
                  "title": "🚀 AliOS Build Successful!",
                  "url": commit_url,
                  "description": f"**Message:** {msg_text}\n\n```diff\n{diff_text}\n
```",
                  "color": 2326507,
                  "footer": {"text": "AliOS Continuous Integration 🥹"}
              }]
          }
          with open("payload.json", "w") as f:
              json.dump(payload, f)
          '
        env:
          RAW_DIFF: ${{ steps.get_diff.outputs.diff }} # See note below
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.event.head_commit.url }}

      - name: Post to Discord
        run: |
          curl -H "Content-Type: application/json" -d @payload.json ${{ secrets.DISCORD_WEBHOOK }}
