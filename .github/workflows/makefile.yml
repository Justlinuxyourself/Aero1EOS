name: Aero1EOS Automatic Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm gcc-multilib binutils \
            xorriso mtools grub-common grub-pc-bin cloc jq

      - name: Build Kernel and ISO
        id: build_step
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Aero1EOS Continuous Build"
          body: |
            Automated build of Aero1EOS for the notebook hardware.
            **Commit:** ${{ github.sha }}
          files: |
            aero1eos4.iso
            aero1eos4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Statistics
        id: stats
        # Only run stats if the build actually worked
        if: success()
        run: |
          # Compare the last commit to its parent
          BEFORE_SHA="HEAD~1"
          CURRENT_SHA="HEAD"

          echo '{"files": []}' > stats.json

          # Filter for relevant source files
          FILES=$(git diff --name-only $BEFORE_SHA $CURRENT_SHA -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' '*.cfg' '*.yml' || echo "")
          
          if [ ! -z "$FILES" ]; then
            for filename in $FILES; do
              if [ -f "$filename" ]; then
                # Get raw numbers from git numstat
                STATS=$(git diff --numstat $BEFORE_SHA $CURRENT_SHA -- "$filename")
                RAW_ADDED=$(echo "$STATS" | awk '{print $1}' | grep -E '^[0-9]+$' || echo 0)
                RAW_REMOVED=$(echo "$STATS" | awk '{print $2}' | grep -E '^[0-9]+$' || echo 0)

                # Calculate "Changed" as the overlapping lines
                if [ "$RAW_ADDED" -lt "$RAW_REMOVED" ]; then
                  CHANGED=$RAW_ADDED
                else
                  CHANGED=$RAW_REMOVED
                fi
                
                # The leftovers are pure additions or pure removals
                PURE_ADDED=$((RAW_ADDED - CHANGED))
                PURE_REMOVED=$((RAW_REMOVED - CHANGED))

                jq --arg f "$filename" --arg a "$PURE_ADDED" --arg r "$PURE_REMOVED" --arg c "$CHANGED" \
                '.files += [{"name": $f, "added": $a, "removed": $r, "changed": $c}]' stats.json > tmp.json && mv tmp.json stats.json
              fi
            done
          fi
      - name: Update README with Commit Count
        if: always()
        run: |
          CURRENT_COUNT=$(git rev-list --count HEAD)
          TOTAL_COUNT=$((CURRENT_COUNT + 467))
          
          # Only update if the number inside the tags matches the new total
          if grep -q "<!--COMMIT_COUNT-->$TOTAL_COUNT<!--/COMMIT_COUNT-->" README.md; then
            echo "Count is already up to date. Skipping."
          else
            # Only replaces the number specifically between the tags
            sed -i "s/<!--COMMIT_COUNT-->[0-9]*<!--\/COMMIT_COUNT-->/<!--COMMIT_COUNT-->$TOTAL_COUNT<!--\/COMMIT_COUNT-->/" README.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: auto-update commit count to $TOTAL_COUNT [skip ci]"
            git push
          fi
      - name: Post Discord Report
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_STATUS: ${{ steps.build_step.outcome }}
        run: |
          LATEST_MSG=$(git log -1 --pretty=%B)
          export COMMIT_MSG="$LATEST_MSG"

          python3 << 'EOF'
          import json
          import os
          import requests
          import random

          def send_report():
              webhook_url = os.getenv('DISCORD_WEBHOOK')
              commit_msg = os.getenv('COMMIT_MSG', 'Manual Sync/Update')
              build_status = os.getenv('BUILD_STATUS', 'failure')
              
              # List of real-life aviation photo URLs
              plane_images = [
                  "https://upload.wikimedia.org/wikipedia/commons/6/64/RSAF_Typhoon_at_Malta_-_Gordon_Zammit.jpg",
                  "https://upload.wikimedia.org/wikipedia/commons/7/72/RSF484_departing_East_Midlands_Airport_%28altered%29.jpg",
                  "https://upload.wikimedia.org/wikipedia/commons/8/86/Saudi_Hawks_at_airpower_%28cropped%29.jpg",
                  "https://upload.wikimedia.org/wikipedia/commons/5/53/RSAF_KC-707_%28cropped%29.jpg",
              ]
              
              # Set up content based on success/failure
              if build_status == 'success':
                  title = "Aero1EOS Build Successful! HELL YEA-🦅"
                  color = 2326507 
                  description = f"**Commit Details:**\n{commit_msg}\n\n"
                  
                  if os.path.exists('stats.json'):
                      try:
                          with open('stats.json', 'r') as f:
                              data = json.load(f)
                          if data.get('files'):
                              for file in data['files']:
                                  stats = []
                                  if int(file['added']) > 0: stats.append(f"+{file['added']}")
                                  if int(file['removed']) > 0: stats.append(f"-{file['removed']}")
                                  if int(file['changed']) > 0: stats.append(f"~{file['changed']}")
                                  stat_line = " | ".join(stats) if stats else "No changes"
                                  description += f"**`{file['name']}`**\n`{stat_line}`\n"
                      except:
                          description += "_Stats generation failed._"
              else:
                  title = "Build Failed! ☹️☹️☹️ Ali is Suffering Right now"
                  color = 15158332
                  description = f"**Failed Commit:**\n{commit_msg}\n\nCheck the GitHub Actions tab to inspect the GCC/NASM compiler logs."

              payload = {
                  "content": "<@&1503391410785882225>",
                  "embeds": [{
                      "title": title,
                      "description": description,
                      "color": color,
                      "image": {"url": random.choice(plane_images)}
                  }]
              }
              requests.post(webhook_url, json=payload)

          if __name__ == "__main__":
              send_report()
          EOF
