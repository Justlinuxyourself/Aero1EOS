
name: AliOS Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            gcc-multilib \
            binutils \
            xorriso \
            mtools \
            grub-common \
            grub-pc-bin

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            This is an automated build of AliOS for the notebook hardware.
            
            **Last Updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Discord Payload
        if: always()
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # 1. Capture full diff to a file to avoid "Argument list too long"
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          
          git diff --unified=0 $BEFORE_SHA $AFTER_SHA -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' > raw_diff.txt || echo "" > raw_diff.txt

          # 2. Python logic reading from the file
          python3 -c '
          import json, os

          def run():
              try:
                  with open("raw_diff.txt", "r") as f:
                      lines = f.readlines()
              except:
                  lines = []
              
              output_sections = []
              current_file_changes = []
              current_file_name = ""

              def flush():
                  nonlocal current_file_changes, output_sections
                  if current_file_name and current_file_changes:
                      section = f"# {current_file_name} Changes:\n```diff\n"
                      # Limit internal file diff to 1500 chars to stay safe
                      content = "".join(current_file_changes)
                      if len(content) > 1500:
                          content = content[:1500] + "\n... (file truncated)"
                      section += content + "```"
                      output_sections.append(section)
                      current_file_changes = []

              for line in lines:
                  line = line.rstrip("\n")
                  if line.startswith("diff --git"):
                      flush()
                      current_file_name = line.split(" b/")[-1] if " b/" in line else "Unknown"
                  elif line.startswith("+") and not line.startswith("+++"):
                      current_file_changes.append(line + "\n")
                  elif line.startswith("-") and not line.startswith("---"):
                      current_file_changes.append(line + "\n")
              
              flush()

              msg = os.getenv("COMMIT_MSG", "No commit message")
              description = f"**Message:** {msg}\n\n" + "\n\n".join(output_sections)
              
              # Discord limit is 4096. We cap at 3800 to be safe.
              if len(description) > 3800:
                  description = description[:3800] + "\n\n... (Total diff truncated)"

              actor = os.getenv("ACTOR", "Unknown")
              payload = {
                  "content": "<@&1503391410785882225>",
                  "embeds": [{
                      "author": {
                          "name": actor,
                          "icon_url": f"https://github.com/{actor}.png"
                      },
                      "title": "🚀 AliOS Build Successful!",
                      "url": os.getenv("COMMIT_URL"),
                      "description": description,
                      "color": 2326507,
                      "footer": {"text": "AliOS Notebook Continuous Build 🥹"}
                  }]
              }

              with open("payload.json", "w") as f:
                  json.dump(payload, f)

          run()
          '

      - name: Post to Discord
        if: always()
        run: |
          if [ -f payload.json ]; then
            curl -i -X POST -H "Content-Type: application/json" -d @payload.json ${{ secrets.DISCORD_WEBHOOK }}
          else
            echo "Payload file not found, skipping Discord post."
          fi

