
name: AliOS Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            gcc-multilib \
            binutils \
            xorriso \
            mtools \
            grub-common \
            grub-pc-bin

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            This is an automated build of AliOS for the notebook hardware.
            
            **Last Updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Source Diff and Ping Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # 1. Get the diff with + and - markers. 
          # We use --unified=3 to get a little context around changes.
          # Filtering for source files to keep the noise down.
          RAW_DIFF=$(git diff ${{ github.event.before }} ${{ github.sha }} -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' | head -n 25)
          
          if [ -z "$RAW_DIFF" ]; then
            RAW_DIFF="No source code changes detected. Ali is a dumbahh"
          fi

          # 2. Robust escaping for JSON
          # This handles backslashes, quotes, and newlines properly for the curl payload
          CLEAN_DIFF=$(echo "$RAW_DIFF" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' | sed 's/^"//;s/"$//')
          CLEAN_MSG=$(echo "${{ github.event.head_commit.message }}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' | sed 's/^"//;s/"$//')

          # 3. Construct the JSON with diff syntax highlighting block
          # Discord identifies '+' as green and '-' as red inside ```diff blocks
          PAYLOAD="{
            \"content\": \"<@&1503391410785882225>\",
            \"embeds\": [{
              \"author\": {
                \"name\": \"${{ github.actor }}\",
                \"icon_url\": \"[https://github.com/$](https://github.com/$){{ github.actor }}.png\"
              },
              \"title\": \"AliOS Build Successful YAYAYAYAYAYAYAYAYYYYYYY\",
              \"url\": \"${{ github.event.head_commit.url }}\",
              \"description\": \"**Commit Message:**\\n$CLEAN_MSG\\n\\n**Patch Preview:**\\n\`\`\`diff\\n$CLEAN_DIFF\\n\`\`\`\",
              \"color\": 2326507,
              \"footer\": { \"text\": \"AliOS Continuous Integration 🥹\" }
            }]
          }"

          curl -H "Content-Type: application/json" -d "$PAYLOAD" $DISCORD_WEBHOOK
