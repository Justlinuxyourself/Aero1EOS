name: AliOS Automatic Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm gcc-multilib binutils \
            xorriso mtools grub-common grub-pc-bin cloc jq

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            Automated build of AliOS for the notebook hardware.
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Statistics
        id: stats
        run: |
          # Compare the current commit (HEAD) to its parent (HEAD~)
          # This ensures we only see what changed in the most recent push
          BEFORE_SHA="HEAD~1"
          CURRENT_SHA="HEAD"

          # Initialize JSON
          echo '{"files": []}' > stats.json

          # Get list of files changed in the LAST commit only
          FILES=$(git diff --name-only $BEFORE_SHA $CURRENT_SHA -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' || echo "")
          
          if [ -z "$FILES" ]; then
            echo "No relevant source files changed."
          else
            for filename in $FILES; do
              if [ -f "$filename" ]; then
                # Get the actual line diffs
                STATS=$(git diff --numstat $BEFORE_SHA $CURRENT_SHA -- "$filename")
                RAW_ADDED=$(echo "$STATS" | awk '{print $1}' | grep -E '^[0-9]+$' || echo 0)
                RAW_REMOVED=$(echo "$STATS" | awk '{print $2}' | grep -E '^[0-9]+$' || echo 0)

                # Logic: Changes = min(added, removed)
                if [ "$RAW_ADDED" -lt "$RAW_REMOVED" ]; then
                  CHANGED=$RAW_ADDED
                else
                  CHANGED=$RAW_REMOVED
                fi
                
                ADDED=$((RAW_ADDED - CHANGED))
                REMOVED=$((RAW_REMOVED - CHANGED))

                # Get CLOC counts
                CLOC_BEFORE=$(git show $BEFORE_SHA:"$filename" 2>/dev/null | cloc --stdin-name="$filename" --json - | jq '.[].code // 0' | head -n 1 || echo 0)
                CLOC_AFTER=$(cloc "$filename" --json | jq '.[].code // 0' | head -n 1 || echo 0)

                jq --arg f "$filename" --arg a "$ADDED" --arg r "$REMOVED" --arg c "$CHANGED" --arg cb "$CLOC_BEFORE" --arg ca "$CLOC_AFTER" \
                '.files += [{"name": $f, "added": $a, "removed": $r, "changed": $c, "before": $cb, "after": $ca}]' stats.json > tmp.json && mv tmp.json stats.json
              fi
            done
          fi
          cat stats.json

      - name: Post Discord Report
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import requests

          def send_report():
              webhook_url = os.getenv('DISCORD_WEBHOOK')
              commit_msg = os.getenv('COMMIT_MSG', 'Manual build or dispatch')
              
              if not os.path.exists('stats.json'):
                  return

              try:
                  with open('stats.json', 'r') as f:
                      data = json.load(f)
              except:
                  return

              description = f"**Commit Message:** {commit_msg}\n\n"
              
              if not data.get('files'):
                  description += "*Build updated, but no source code changes detected in this push.*"
              else:
                  for file in data['files']:
                      lines = []
                      if int(file['added']) > 0: lines.append(f"• {file['added']} added")
                      if int(file['removed']) > 0: lines.append(f"• {file['removed']} removed")
                      if int(file['changed']) > 0: lines.append(f"• {file['changed']} changed")
                      
                      stats_str = "\n".join(lines) if lines else "• Metadata/Format changes"
                      
                      file_block = (
                          f"**`{file['name']}`**\n"
                          f"{stats_str}\n"
                          f"```\nLines: {file['before']} -> {file['after']}\n
```\n"
                      )
                      
                      if len(description) + len(file_block) > 3800:
                          description += "... (truncated)"
                          break
                      description += file_block

              payload = {
                  "content": "<@&1503391410785882225>",
                  "embeds": [{
                      "title": "AliOS Build Successful! 🦅",
                      "description": description,
                      "color": 2326507
                  }]
              }
              requests.post(webhook_url, json=payload)

          if __name__ == "__main__":
              send_report()
          EOF
