name: AliOS Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            gcc-multilib \
            binutils \
            xorriso \
            mtools \
            grub-common \
            grub-pc-bin

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            This is an automated build of AliOS for the notebook hardware.
            
            **Last Updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Discord Payload
        if: always()
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
        run: |
          # 1. Capture the diff and strip the "header" noise
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          
          # We use tail -n +5 to skip the 'diff --git', 'index', '---', and '+++' lines
          # This leaves just the @@ and the +/- lines which Discord colors perfectly
          RAW_DIFF=$(git diff --patch --unified=3 $BEFORE_SHA $AFTER_SHA -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' | grep -E "^[+|-][^+|-]" | head -n 25)
          
          if [ -z "$RAW_DIFF" ]; then 
            RAW_DIFF="No source code changes detected."
          fi

          export FINAL_DIFF="$RAW_DIFF"

          # 2. Build the JSON
          python3 -c '
          import json, os

          actor = os.getenv("ACTOR", "Unknown")
          msg = os.getenv("COMMIT_MSG", "No message")
          url = os.getenv("COMMIT_URL", "#")
          diff = os.getenv("FINAL_DIFF", "")

          payload = {
              "content": "<@&1503391410785882225>",
              "embeds": [{
                  "author": {
                      "name": actor,
                      "icon_url": f"https://github.com/{actor}.png"
                  },
                  "title": "🚀 AliOS Build Successful!",
                  "url": url,
                  "description": f"**Message:** {msg}\n\n```diff\n{diff}\n```",
                  "color": 2326507,
                  "footer": {"text": "AliOS Continuous Integration 🥹"}
              }]
          }

          with open("payload.json", "w") as f:
              json.dump(payload, f)
          '

      - name: Post to Discord
        if: always()
        run: |
          curl -i -X POST -H "Content-Type: application/json" \
               -d @payload.json \
               ${{ secrets.DISCORD_WEBHOOK }}
