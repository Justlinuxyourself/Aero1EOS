name: AliOS Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            gcc-multilib \
            binutils \
            xorriso \
            mtools \
            grub-common \
            grub-pc-bin

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            This is an automated build of AliOS for the notebook hardware.
            
            **Last Updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification
        if: always() # Sends even if the build fails, so you know what happened
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          # 1. Get the Diff
          # Handle the case where BEFORE_SHA is empty (first push)
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          
          RAW_DIFF=$(git diff $BEFORE_SHA $AFTER_SHA -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' | head -n 25)
          
          if [ -z "$RAW_DIFF" ]; then 
            RAW_DIFF="No source code changes detected (Binary update only)."
          fi

          # Export for Python environment
          export FINAL_DIFF="$RAW_DIFF"

          # 2. Build the JSON safely using Python
          python3 -c '
          import json, os
          
          payload = {
              "content": "<@&1503391410785882225>",
              "embeds": [{
                  "author": {
                      "name": os.environ.get("ACTOR"),
                      "icon_url": f"https://github.com/{os.environ.get(\"ACTOR\")}.png"
                  },
                  "title": "🚀 AliOS Build Successful!",
                  "url": os.environ.get("COMMIT_URL"),
                  "description": f"**Message:** {os.environ.get(\"COMMIT_MSG\")}\n\n```diff\n{os.environ.get(\"FINAL_DIFF\")}\n
```",
                  "color": 2326507,
                  "footer": {"text": "AliOS Continuous Integration 🥹"}
              }]
          }
          with open("payload.json", "w") as f:
              json.dump(payload, f)
          '

          # 3. Final CURL
          curl -i -H "Content-Type: application/json" -d @payload.json $DISCORD_WEBHOOK
