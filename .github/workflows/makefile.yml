
name: AliOS Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
              fetch-depth: 0
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            gcc-multilib \
            binutils \
            xorriso \
            mtools \
            grub-common \
            grub-pc-bin

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            This is an automated build of AliOS for the notebook hardware.
            
            **Last Updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Commit Diff
        id: diff
        run: |
          # Fetch the previous commit so we can compare
          git fetch origin ${{ github.event.before }} --depth=1
          # Get the diff (patch), limit to 10 lines so it fits in Discord
          DIFF=$(git diff ${{ github.event.before }} ${{ github.sha }} | head -n 10)
          # Clean up the diff to prevent JSON errors
          DIFF="${DIFF//'%'/'%25'}"
          DIFF="${DIFF//$'\n'/'%0A'}"
          DIFF="${DIFF//$'\r'/'%0D'}"
          echo "patch=$DIFF" >> $GITHUB_OUTPUT

      - name: Ping Discord
        run: |
          # Decode the patch for the curl command
          PATCH=$(printf "${{ steps.diff.outputs.patch }}")
          
          curl -H "Content-Type: application/json" \
               -d '{
                 "content": "<@&1503391410785882225>",
                 "embeds": [{
                   "author": {
                     "name": "${{ github.actor }}",
                     "icon_url": "https://github.com/github.png"
                   },
                   "title": "[AliOS:master] 1 new commit",
                   "url": "${{ github.event.head_commit.url }}",
                   "description": "**Message:** ${{ github.event.head_commit.message }}\n\n```diff\n'"$PATCH"'\n```",
                   "color": 2326507
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK }}
