
name: AliOS Automatic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            gcc-multilib \
            binutils \
            xorriso \
            mtools \
            grub-common \
            grub-pc-bin

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            This is an automated build of AliOS for the notebook hardware.
            
            **Last Updated:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Source Diff and Ping Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # 1. Extract the diff BUT ignore binary files so we get Red/Green text
          # We filter for common source extensions (.c, .h, .asm, .s, .md, Makefile)
          # This ensures the bot actually shows the code logic changes.
          DIFF=$(git diff ${{ github.event.before }} ${{ github.sha }} -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' | head -n 30)
          
          # Fallback if the diff is empty (e.g. only binaries changed)
          if [ -z "$DIFF" ]; then
            DIFF="No source code changes detected (Binary update only)."
          fi

          # 2. Escape characters for JSON (Newlines, Backslashes, Quotes)
          ESCAPED_DIFF=$(echo "$DIFF" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          ESCAPED_MSG=$(echo "${{ github.event.head_commit.message }}" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')

          # 3. Send to Discord with diff syntax highlighting
          curl -H "Content-Type: application/json" \
               -d "{
                 \"content\": \"<@&1503391410785882225>\",
                 \"embeds\": [{
                   \"author\": {
                     \"name\": \"${{ github.actor }}\",
                     \"icon_url\": \"https://github.com/${{ github.actor }}.png\"
                   },
                   \"title\": \"[AliOS:master] New Build & Release\",
                   \"url\": \"${{ github.event.head_commit.url }}\",
                   \"description\": \"**Message:** $ESCAPED_MSG\\n\\n\`\`\`diff\\n$ESCAPED_DIFF\\n\`\`\`\",
                   \"color\": 2326507
                 }]
               }" \
               $DISCORD_WEBHOOK

