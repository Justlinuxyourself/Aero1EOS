name: AliOS Automatic Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm gcc-multilib binutils \
            xorriso mtools grub-common grub-pc-bin cloc jq

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            Automated build of AliOS for the notebook hardware.
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Statistics
        id: stats
        run: |
          # Compare the last commit to its parent
          BEFORE_SHA="HEAD~1"
          CURRENT_SHA="HEAD"

          echo '{"files": []}' > stats.json

          # Filter for relevant source files
          FILES=$(git diff --name-only $BEFORE_SHA $CURRENT_SHA -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' || echo "")
          
          if [ ! -z "$FILES" ]; then
            for filename in $FILES; do
              if [ -f "$filename" ]; then
                # Get raw numbers from git numstat
                STATS=$(git diff --numstat $BEFORE_SHA $CURRENT_SHA -- "$filename")
                RAW_ADDED=$(echo "$STATS" | awk '{print $1}' | grep -E '^[0-9]+$' || echo 0)
                RAW_REMOVED=$(echo "$STATS" | awk '{print $2}' | grep -E '^[0-9]+$' || echo 0)

                # Calculate "Changed" as the overlapping lines
                if [ "$RAW_ADDED" -lt "$RAW_REMOVED" ]; then
                  CHANGED=$RAW_ADDED
                else
                  CHANGED=$RAW_REMOVED
                fi
                
                # The leftovers are pure additions or pure removals
                PURE_ADDED=$((RAW_ADDED - CHANGED))
                PURE_REMOVED=$((RAW_REMOVED - CHANGED))

                jq --arg f "$filename" --arg a "$PURE_ADDED" --arg r "$PURE_REMOVED" --arg c "$CHANGED" \
                '.files += [{"name": $f, "added": $a, "removed": $r, "changed": $c}]' stats.json > tmp.json && mv tmp.json stats.json
              fi
            done
          fi

      - name: Post Discord Report
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import requests

          def send_report():
              webhook_url = os.getenv('DISCORD_WEBHOOK')
              commit_msg = os.getenv('COMMIT_MSG', 'Manual Update')
              
              if not os.path.exists('stats.json'): return
              try:
                  with open('stats.json', 'r') as f:
                      data = json.load(f)
              except: return

              description = f"**Commit:** {commit_msg}\n\n"
              
              if not data.get('files'):
                  description += "_No source changes._"
              else:
                  for file in data['files']:
                      stats = []
                      if int(file['added']) > 0: stats.append(f"+{file['added']} added")
                      if int(file['removed']) > 0: stats.append(f"-{file['removed']} removed")
                      if int(file['changed']) > 0: stats.append(f"~{file['changed']} changed")
                      
                      # join the stats with a dot for a single-line look
                      stat_line = " | ".join(stats) if stats else "No line changes"
                      description += f"**`{file['name']}`**\n`{stat_line}`\n"

              payload = {
                  "content": "<@&1503391410785882225>",
                  "embeds": [{
                      "title": "AliOS Build Successful! 🦅",
                      "description": description,
                      "color": 2326507
                  }]
              }
              requests.post(webhook_url, json=payload)

          if __name__ == "__main__":
              send_report()
          EOF
