name: AliOS Automatic Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  auto-release:
    name: Build and Auto-Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm gcc-multilib binutils \
            xorriso mtools grub-common grub-pc-bin cloc jq

      - name: Build Kernel and ISO
        run: |
          make clean
          make 

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AliOS Continuous Build"
          body: |
            Automated build of AliOS for the notebook hardware.
            **Commit:** ${{ github.sha }}
          files: |
            alios4.iso
            alios4.bin
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Statistics
        id: stats
        run: |
          BEFORE_SHA=${{ github.event.before }}
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi

          echo '{"files": []}' > stats.json

          git diff --name-only $BEFORE_SHA ${{ github.sha }} -- '*.c' '*.h' '*.asm' '*.s' 'Makefile' '*.md' | while read filename; do
            if [ -f "$filename" ]; then
              STATS=$(git diff --numstat $BEFORE_SHA ${{ github.sha }} -- "$filename")
              RAW_ADDED=$(echo "$STATS" | awk '{print $1}' || echo 0)
              RAW_REMOVED=$(echo "$STATS" | awk '{print $2}' || echo 0)
              
              # Logic: Changes = min(added, removed)
              # New Added = Total Added - Changes
              # New Removed = Total Removed - Changes
              if [ "$RAW_ADDED" -lt "$RAW_REMOVED" ]; then
                CHANGED=$RAW_ADDED
              else
                CHANGED=$RAW_REMOVED
              fi
              
              ADDED=$((RAW_ADDED - CHANGED))
              REMOVED=$((RAW_REMOVED - CHANGED))

              CLOC_BEFORE=$(git show $BEFORE_SHA:"$filename" 2>/dev/null | cloc --stdin-name="$filename" --json - | jq '.[].code // 0' | head -n 1)
              CLOC_AFTER=$(cloc "$filename" --json | jq '.[].code // 0' | head -n 1)

              jq --arg f "$filename" --arg a "$ADDED" --arg r "$REMOVED" --arg c "$CHANGED" --arg cb "${CLOC_BEFORE:-0}" --arg ca "${CLOC_AFTER:-0}" \
              '.files += [{"name": $f, "added": $a, "removed": $r, "changed": $c, "before": $cb, "after": $ca}]' stats.json > tmp.json && mv tmp.json stats.json
            fi
          done

      - name: Post Discord Report
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import requests

          def send_report():
              try:
                  with open('stats.json', 'r') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"Error reading stats: {e}")
                  return

              webhook_url = os.getenv('DISCORD_WEBHOOK')
              commit_msg = os.getenv('COMMIT_MSG', 'No message')
              description = f"**Message:** {commit_msg}\n\n"
              
              for file in data['files']:
                  # Only add lines if they are > 0 to keep the report clean
                  stats_line = []
                  if int(file['added']) > 0: stats_line.append(f"# {file['added']} lines added")
                  if int(file['removed']) > 0: stats_line.append(f"# {file['removed']} lines removed")
                  if int(file['changed']) > 0: stats_line.append(f"# {file['changed']} lines changed")
                  
                  stats_str = "\n".join(stats_line) if stats_line else "# No logic changes"

                  file_block = (
                      f"**({file['name']})**\n"
                      f"{stats_str}\n"
                      f"```\nCLOC Before update: {file['before']} lines\n```\n"
                      f"```\nCLOC After update: {file['after']} lines\n```\n"
                  )
                  
                  if len(description) + len(file_block) > 3900:
                      description += "... (more files truncated)"
                      break
                  description += file_block

              payload = {
                  "content": "<@&1503391410785882225>",
                  "embeds": [{
                      "title": "AliOS Build Successful! HELL YE🦅🦅🦅",
                      "description": description,
                      "color": 2326507,
                      "footer": {"text": "AliOS Notebook Continuous Build 🥹"}
                  }]
              }

              requests.post(webhook_url, json=payload)

          if __name__ == "__main__":
              send_report()
          EOF
